# Variant: C1 confidence extraction only, still uses Leiden + fixed-hop
_base: "config/base.yaml"
variant_name: "ablation_c1_only"
confidence:
  enabled: true
community:
  strategy: "leiden"    # standard Leiden, no confidence weighting
traversal:
  strategy: "fixed_hop"
  fixed_hop:
    k: 3
parallel:
  enabled: false
use_graph: true
